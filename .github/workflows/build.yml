name: Zbuduj APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Zbuduj aplikację
        run: gradle assembleDebug --no-daemon

      - name: Przygotuj jeden plik APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Dzielnik.apk

      - name: Wystaw APK do pobrania (zakładka Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete najnowsza --yes --cleanup-tag || true
          gh release create najnowsza Dzielnik.apk --target "$GITHUB_SHA" --title "Dzielnik (najnowsza wersja)" --notes "Pobierz plik Dzielnik.apk i zainstaluj go na telefonie."
