name: Zbuduj APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Zbuduj aplikację
        shell: bash
        run: gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Zapisz koniec logu, jeśli budowa się nie udała
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete blad-budowy --yes --cleanup-tag || true
          tail -c 20000 build.log > blad.txt || echo "brak logu" > blad.txt
          gh release create blad-budowy --target "$GITHUB_SHA" --title "Błąd budowy" --notes-file blad.txt

      - name: Przygotuj jeden plik APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Powiadomienia.apk

      - name: Wystaw APK do pobrania (zakładka Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete blad-budowy --yes --cleanup-tag || true
          gh release delete najnowsza --yes --cleanup-tag || true
          gh release create najnowsza Powiadomienia.apk --target "$GITHUB_SHA" --title "Powiadomienia (najnowsza wersja)" --notes "Pobierz plik Powiadomienia.apk i zainstaluj go na telefonie."
