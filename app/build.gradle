plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.dzielnik'
    compileSdk 34

    defaultConfig {
        applicationId 'pl.dzielnik'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    // Stały klucz testowy (publiczny, tylko do użytku osobistego): każda następna wersja instaluje się
    // na poprzednią bez odinstalowywania, więc ustawienia, w tym klucz Gemini, zostają w telefonie.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
